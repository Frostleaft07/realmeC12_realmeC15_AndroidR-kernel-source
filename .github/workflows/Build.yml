name: Endfield

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'select branch'
        required: true
        default: 'endfield'
        type: choice
        options:
          - endfield
          - 4.19-upstream
      kernelsu_variant:
        description: 'KernelSU variant'
        required: true
        type: choice
        default: 'SukiSU-Ultra'
        options:
          - 'SukiSU-Ultra'
          - 'KernelSU-Next'
          - 'KernelSU'
          - 'None'
      sukisu_branch:
        description: 'sukisu branch'
        required: true
        default: 'nongki'
        type: choice
        options:
          - nongki
          - susfs-main
      kpm:
        description: 'build dengan KPM (hanya SUKISU)'
        required: true
        type: choice
        default: 'yes'
        options:
          - 'yes'
          - 'no'
      localversion:
        description: 'Custom LOCALVERSION (e.g., -MyKernel)'
        required: true
        default: '-Endfield 🪐'
        type: string
      defconfig:
        description: 'pilih defconfig lain kalo mau (exm. nethunter)'
        required: true
        default: 'endfield_defconfig'
        type: string
      build_user:
        description: 'set user (xxx@host)'
        required: true
        default: 'Frostleaft07'
        type: string
      build_host:
        description: 'set host (user@xxx)'
        required: true
        default: 'Darkness'
        type: string
      timezone:
        description: 'set timezone'
        required: true
        default: 'Asia/Jakarta'
        type: string
      hook:
        description: 'hook manual/tracepoint'
        required: true
        default: 'manual'
        type: choice
        options:
          - manual
          - tracepoint

env:
  KBUILD_BUILD_USER: ${{ github.event.inputs.build_user }}
  KBUILD_BUILD_HOST: ${{ github.event.inputs.build_host }}
  LOCALVERSION: ${{ github.event.inputs.localversion }}
  TZ: ${{ github.event.inputs.timezone }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.inputs.branch }}
        fetch-depth: 0

    - name: Setup SukiSU/KSU/KSUN
      run: |
        KSU_VARIANT="${{ github.event.inputs.kernelsu_variant }}"
        KPM="${{ github.event.inputs.kpm }}"

        if [ "$KSU_VARIANT" == "SukiSU-Ultra" ]; then
          BRANCH="${{ github.event.inputs.sukisu_branch }}"
          HOOK="${{ github.event.inputs.hook }}"
          DEFCONFIG="arch/arm64/configs/${{ github.event.inputs.defconfig }}"

        if [ "$BRANCH" == "susfs-main" ]; then
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
        elif [ "$BRANCH" == "nongki" ]; then
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s nongki
        fi

        if [ "$HOOK" == "manual" ]; then
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEFCONFIG"
        elif [ "$HOOK" == "tracepoint" ]; then
          echo "CONFIG_KSU_TRACEPOINT_HOOK=y" >> "$DEFCONFIG"
        fi

        if [ "$KPM" == "yes" ]; then
          echo "CONFIG_KPM=y" >> "$DEFCONFIG"
        elif [ "$KPM" == "no" ]; then
          echo "Non KPM"
        fi

        elif [ "$KSU_VARIANT" == "KernelSU-Next" ]; then
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          git revert --no-edit 87fcb3dd6269bfbd1829fec0cee011f2ad74ce77 36c1971f95e89848df59b18dff7fc47171d24c54

        elif [ "$KSU_VARIANT" == "KernelSU" ]; then
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5
          git revert --no-edit 87fcb3dd6269bfbd1829fec0cee011f2ad74ce77 36c1971f95e89848df59b18dff7fc47171d24c54

        else
          echo "Build tanpa KernelSU"
        fi

    - name: Setup Environment
      run: |
        echo "Build User: $KBUILD_BUILD_USER"
        echo "Build Host: $KBUILD_BUILD_HOST"
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b android11-release
        echo "$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/aarch64-linux-android-4.9/bin:/usr/bin:/bin" >> $GITHUB_PATH
        sed -i -E 's/\bpython2\b ?//g; s/  +/ /g' package
        bash package

    - name: check clang
      run: |
       echo "Current time: $(date)"
       clang -v

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
          swap-size-gb: 5

    - name: Build Kernel
      run: |
        make CC=clang ARCH=arm64 O=~/out ${{ github.event.inputs.defconfig }}
        echo "n" | make CC=clang ARCH=arm64 O=~/out -j$(nproc) \
          HEADER_ARCH=arm64 \
          SUBARCH=arm64 \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          STRIP=llvm-strip \
          READELF=llvm-readelf \
          CROSS_COMPILE=aarch64-linux-android- \
          CLANG_TRIPLE=aarch64-linux-gnu-
    
    - name: patch KPM
      run: |
        KSU_VARIANT="${{ github.event.inputs.kernelsu_variant }}"
        KPM_ENABLE="${{ github.event.inputs.kpm }}"

        if [ "$KSU_VARIANT" == "SukiSU-Ultra" ] && [ "$KPM_ENABLE" == "yes" ]; then
          echo "patch file Image..."
          cd "~/out/arch/arm64/boot"
          wget https://github.com/SukiSU-Ultra/SukiSU_patch/raw/refs/heads/main/kpm/patch_linux
          chmod +x patch_linux
          ./patch_linux Image
        if [ $? -eq 0 ]; then
          rm -f Image
          mv oImage Image
          gzip -9 -c Image > Image.gz
          echo "Done"
        else
          echo "Failed"
        fi
        else 
          echo "tanpa KPM"
        fi


    - name: anykernel ~ zipping
      run: |
         git clone https://github.com/Frostleaft07/AnyKernel3 -b mastah ~/any/
         mv ~/out/arch/arm64/boot/Image.gz ~/any/
         cd ~/any/ ; zip -r9 Endfield-test.zip *

    - name: Upload to Telegram
      run: |
         curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendDocument" \
         -F chat_id="${{ secrets.CHAT_ID }}" \
         -F message_thread_id="${{ secrets.TOPIC_ID }}" \
         -F caption="$(echo -e "$(date)\n\nRMX2185 UI2\n\nCommit: $(git log -1 --pretty='%h - %s (%ci)')")" \
         -F document=@"/home/runner/any/Endfield-test.zip" > /dev/null 2>&1
