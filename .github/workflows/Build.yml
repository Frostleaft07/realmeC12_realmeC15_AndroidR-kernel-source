name: Endfield

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'select branch'
        required: true
        default: 'endfield'
        type: string
        

env:
  KBUILD_BUILD_USER: Frostleaf
  KBUILD_BUILD_HOST: Darkness
  LOCALVERSION: "-Endfield 🪐"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.inputs.branch }}
        fetch-depth: 1

    - name: SukiSU
      run: |
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s nongki

    - name: Setup Environment
      run: |
        echo "Build User: $KBUILD_BUILD_USER"
        echo "Build Host: $KBUILD_BUILD_HOST"
        echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH
        sed -i -E 's/\bpython2\b ?//g; s/  +/ /g' package
        bash package

    - name: check clang
      run: |
       clang -v
        
    
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
          swap-size-gb: 5

    - name: Build Kernel
      run: |
        make CC=clang ARCH=arm64 O=~/out endfield_defconfig
        echo "n" | make CC=clang ARCH=arm64 O=~/out -j$(nproc) \
          HEADER_ARCH=arm64 \
          SUBARCH=arm64 \
          CXX=c++ \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          READELF=llvm-readelf \
          HOSTCXX=clang++ \
          HOSTAR=llvm-ar \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          CLANG_TRIPLE=aarch64-linux-gnu-

    - name: anykernel ~ zipping
      run: |
         git clone https://github.com/Frostleaft07/AnyKernel3 -b mastah ~/any/
         mv ~/out/arch/arm64/boot/Image.gz ~/any/
         cd ~/any/ ; zip -r9 Endfield-test.zip *

    - name: Upload to Telegram
      run: |
         curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendDocument" \
         -F chat_id="${{ secrets.CHAT_ID }}" \
         -F message_thread_id="${{ secrets.TOPIC_ID }}" \
         -F caption="$(echo -e "$(date)\n\nRMX2185 UI2")" \
         -F document=@"/home/runner/any/Endfield-test.zip" > /dev/null 2>&1
